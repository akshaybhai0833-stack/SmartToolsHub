<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Percentage Calculator - SmartToolsHub</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            padding: 20px;
        }

        .container {
            max-width: 550px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 18px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            display: none;
            margin-top: 25px;
            background: #eef4ff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .result {
            font-size: 24px;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📊 Percentage Calculator</h1>

    <p class="subtitle">
        Calculate percentages quickly and easily
    </p>

    <label for="number">
        Enter Number
    </label>

    <input
        type="number"
        id="number"
        placeholder="Example: 500"
    >

    <label for="percentage">
        Enter Percentage (%)
    </label>

    <input
        type="number"
        id="percentage"
        placeholder="Example: 20"
        step="0.01"
    >

    <button onclick="calculatePercentage()">
        Calculate
    </button>

    <div id="result">

        <p>
            Result:
        </p>

        <div class="result" id="resultText">
            0
        </div>

    </div>

    <a href="index.html" class="back">
        ← Back to SmartToolsHub
    </a>

</div>

<script>

function calculatePercentage() {

    const number =
        parseFloat(document.getElementById("number").value);

    const percentage =
        parseFloat(document.getElementById("percentage").value);

    if (isNaN(number)) {
        alert("Please enter a valid number.");
        return;
    }

    if (isNaN(percentage)) {
        alert("Please enter a valid percentage.");
        return;
    }

    const result =
        (number * percentage) / 100;

    document.getElementById("resultText").textContent =
        result.toLocaleString("en-IN", {
            maximumFractionDigits: 4
        });

    document.getElementById("result").style.display =
        "block";
}

</script>

</body>
</html>
