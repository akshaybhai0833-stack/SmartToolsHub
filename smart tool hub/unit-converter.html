<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Unit Converter - SmartToolsHub</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#f6f8fc;
color:#172033;
}

header{
background:white;
padding:18px 7%;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 15px rgba(0,0,0,.06);
}

.logo{
font-size:25px;
font-weight:bold;
color:#2563eb;
}

nav{
display:flex;
gap:25px;
}

nav a{
text-decoration:none;
color:#374151;
font-weight:bold;
}

main{
max-width:700px;
margin:60px auto;
padding:20px;
}

.card{
background:white;
padding:40px;
border-radius:22px;
box-shadow:0 10px 35px rgba(15,23,42,.08);
}

.icon{
width:75px;
height:75px;
margin:auto auto 20px;
background:#eff5ff;
border-radius:18px;
display:flex;
align-items:center;
justify-content:center;
font-size:38px;
}

h1{
text-align:center;
}

.subtitle{
text-align:center;
color:#64748b;
margin-bottom:30px;
}

select,input{
width:100%;
padding:14px;
margin:8px 0 15px;
border:1px solid #dbe3ef;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:14px;
border:0;
border-radius:10px;
background:#2563eb;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.result{
display:none;
margin-top:25px;
padding:20px;
background:#eff5ff;
border-radius:15px;
text-align:center;
font-size:20px;
font-weight:bold;
}

.back{
display:block;
text-align:center;
margin-top:25px;
color:#2563eb;
text-decoration:none;
font-weight:bold;
}

@media(max-width:600px){

header{
flex-direction:column;
gap:15px;
}

.card{
padding:25px 20px;
}

}

</style>

</head>

<body>

<header>

<div class="logo">SmartToolsHub</div>

<nav>
<a href="index.html">Home</a>
<a href="index.html#tools">Tools</a>
<a href="index.html#about">About</a>
</nav>

</header>

<main>

<div class="card">

<div class="icon">🔄</div>

<h1>Unit Converter</h1>

<p class="subtitle">
Convert common units quickly.
</p>

<label>Conversion Type</label>

<select id="type" onchange="updateLabels()">

<option value="m-km">Meter → Kilometer</option>
<option value="cm-m">Centimeter → Meter</option>
<option value="kg-g">Kilogram → Gram</option>
<option value="c-f">Celsius → Fahrenheit</option>

</select>

<label id="inputLabel">Meter</label>

<input type="number" id="value" placeholder="Enter value">

<button onclick="convert()">
Convert
</button>

<div class="result" id="result"></div>

<a class="back" href="index.html">
← Back to SmartToolsHub
</a>

</div>

</main>

<script>

function updateLabels(){

let type=document.getElementById("type").value;
let label=document.getElementById("inputLabel");

if(type==="m-km") label.innerText="Meter";
if(type==="cm-m") label.innerText="Centimeter";
if(type==="kg-g") label.innerText="Kilogram";
if(type==="c-f") label.innerText="Celsius";

}

function convert(){

let value=parseFloat(document.getElementById("value").value);
let type=document.getElementById("type").value;

if(isNaN(value)){

alert("Please enter a value.");
return;

}

let result;

if(type==="m-km")
result=value/1000+" Kilometer";

if(type==="cm-m")
result=value/100+" Meter";

if(type==="kg-g")
result=value*1000+" Gram";

if(type==="c-f")
result=(value*9/5+32).toFixed(2)+" °F";

document.getElementById("result").innerText=result;

document.getElementById("result").style.display="block";

}

</script>

</body>
</html>
