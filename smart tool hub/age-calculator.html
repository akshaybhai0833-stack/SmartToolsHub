<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Age Calculator - SmartToolsHub</title>

    <meta name="description"
        content="Calculate your exact age in years, months and days with SmartToolsHub free Age Calculator.">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f6f8fc;
            color: #172033;
            min-height: 100vh;
        }

        /* HEADER */

        header {
            background: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 15px rgba(0,0,0,0.06);
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            color: #2563eb;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #374151;
            font-weight: 600;
            font-size: 15px;
        }

        nav a:hover {
            color: #2563eb;
        }

        /* MAIN */

        main {
            max-width: 700px;
            margin: 60px auto;
            padding: 20px;
        }

        .tool-card {
            background: white;
            padding: 40px;
            border-radius: 22px;
            box-shadow: 0 10px 35px rgba(15,23,42,0.08);
            border: 1px solid #e8edf5;
        }

        .tool-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            background: #eff5ff;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
        }

        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #dbe3ef;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            margin-bottom: 20px;
        }

        input:focus {
            border-color: #2563eb;
        }

        .btn {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #eff5ff;
            border-radius: 14px;
            text-align: center;
            display: none;
        }

        .result h2 {
            color: #2563eb;
            margin-bottom: 10px;
        }

        .result p {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.8;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            header {
                flex-direction: column;
                gap: 15px;
                padding: 16px 5%;
            }

            nav {
                gap: 18px;
            }

            main {
                margin: 30px auto;
                padding: 15px;
            }

            .tool-card {
                padding: 25px 20px;
            }

            h1 {
                font-size: 27px;
            }

        }

    </style>
</head>

<body>

    <header>

        <div class="logo">
            SmartToolsHub
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#tools">Tools</a>
            <a href="index.html#about">About</a>
        </nav>

    </header>


    <main>

        <div class="tool-card">

            <div class="tool-icon">
                🎂
            </div>

            <h1>Age Calculator</h1>

            <p class="subtitle">
                Calculate your exact age in years, months and days.
            </p>


            <label for="dob">
                Enter your Date of Birth
            </label>

            <input
                type="date"
                id="dob"
            >


            <button class="btn" onclick="calculateAge()">
                Calculate Age
            </button>


            <div class="result" id="result">

                <h2>Your Age</h2>

                <p id="ageText"></p>

            </div>


            <a class="back" href="index.html">
                ← Back to SmartToolsHub
            </a>

        </div>

    </main>


    <script>

        function calculateAge() {

            let dob =
                document.getElementById("dob").value;

            if (!dob) {

                alert("Please select your date of birth.");

                return;
            }

            let birthDate =
                new Date(dob);

            let today =
                new Date();

            let years =
                today.getFullYear() -
                birthDate.getFullYear();

            let months =
                today.getMonth() -
                birthDate.getMonth();

            let days =
                today.getDate() -
                birthDate.getDate();


            if (days < 0) {

                months--;

                let previousMonth =
                    new Date(
                        today.getFullYear(),
                        today.getMonth(),
                        0
                    );

                days +=
                    previousMonth.getDate();
            }


            if (months < 0) {

                years--;

                months += 12;
            }


            if (birthDate > today) {

                alert("Date of birth cannot be in the future.");

                return;
            }


            document.getElementById("ageText").innerHTML =
                years + " Years, " +
                months + " Months, " +
                days + " Days";


            document.getElementById("result").style.display =
                "block";

        }

    </script>

</body>

</html>
