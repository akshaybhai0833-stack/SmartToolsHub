<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Image Compressor - SmartToolsHub</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#f6f8fc;
color:#172033;
}

header{
background:white;
padding:18px 7%;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 15px rgba(0,0,0,.06);
}

.logo{
font-size:25px;
font-weight:bold;
color:#2563eb;
}

nav{
display:flex;
gap:25px;
}

nav a{
text-decoration:none;
color:#374151;
font-weight:bold;
}

main{
max-width:750px;
margin:60px auto;
padding:20px;
}

.card{
background:white;
padding:40px;
border-radius:22px;
box-shadow:0 10px 35px rgba(15,23,42,.08);
text-align:center;
}

.icon{
width:75px;
height:75px;
margin:auto auto 20px;
background:#eff5ff;
border-radius:18px;
display:flex;
align-items:center;
justify-content:center;
font-size:38px;
}

h1{
margin-bottom:10px;
}

.subtitle{
color:#64748b;
margin-bottom:25px;
}

input[type="file"]{
width:100%;
padding:15px;
border:1px dashed #2563eb;
border-radius:12px;
background:#f8fbff;
}

input[type="range"]{
width:100%;
margin:20px 0;
}

button{
width:100%;
padding:14px;
margin-top:15px;
border:0;
border-radius:10px;
background:#2563eb;
color:white;
font-weight:bold;
font-size:16px;
cursor:pointer;
}

.result{
display:none;
margin-top:25px;
padding:20px;
background:#eff5ff;
border-radius:15px;
}

.preview{
max-width:100%;
margin-top:20px;
border-radius:10px;
}

.back{
display:block;
margin-top:25px;
color:#2563eb;
text-decoration:none;
font-weight:bold;
}

</style>

</head>

<body>

<header>

<div class="logo">SmartToolsHub</div>

<nav>
<a href="index.html">Home</a>
<a href="index.html#tools">Tools</a>
<a href="index.html#about">About</a>
</nav>

</header>

<main>

<div class="card">

<div class="icon">🖼️</div>

<h1>Image Compressor</h1>

<p class="subtitle">
Reduce image file size while keeping good quality.
</p>

<input
type="file"
id="imageInput"
accept="image/jpeg,image/png,image/webp">

<label>
Quality:
<span id="qualityValue">70</span>%
</label>

<input
type="range"
id="quality"
min="10"
max="100"
value="70"
oninput="updateQuality()">

<button onclick="compressImage()">
Compress Image
</button>

<div class="result" id="result">

<p id="sizeInfo"></p>

<img id="preview" class="preview">

<button onclick="downloadImage()">
Download Compressed Image
</button>

</div>

<a class="back" href="index.html">
← Back to SmartToolsHub
</a>

</div>

</main>

<script>

let compressedBlob=null;

function updateQuality(){

document.getElementById("qualityValue").innerText=
document.getElementById("quality").value;

}

function compressImage(){

let file=document.getElementById("imageInput").files[0];

if(!file){

alert("Please select an image.");
return;

}

let quality=
parseInt(document.getElementById("quality").value)/100;

let img=new Image();

let reader=new FileReader();

reader.onload=function(e){

img.src=e.target.result;

};

img.onload=function(){

let canvas=document.createElement("canvas");

let ctx=canvas.getContext("2d");

canvas.width=img.width;
canvas.height=img.height;

ctx.drawImage(img,0,0);

canvas.toBlob(function(blob){

compressedBlob=blob;

let originalKB=(file.size/1024).toFixed(2);
let compressedKB=(blob.size/1024).toFixed(2);

let reduction=
((1-blob.size/file.size)*100).toFixed(1);

document.getElementById("sizeInfo").innerHTML=
"Original: "+originalKB+" KB<br>"+
"Compressed: "+compressedKB+" KB<br>"+
"Reduction: "+reduction+"%";

document.getElementById("preview").src=
URL.createObjectURL(blob);

document.getElementById("result").style.display="block";

},"image/jpeg",quality);

};

reader.readAsDataURL(file);

}

function downloadImage(){

if(!compressedBlob){

alert("Compress an image first.");
return;

}

let link=document.createElement("a");

link.href=URL.createObjectURL(compressedBlob);

link.download="SmartToolsHub-compressed.jpg";

link.click();

}

</script>

</body>
</html>
