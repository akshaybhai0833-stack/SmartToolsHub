<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Password Generator - SmartToolsHub</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#f6f8fc;
color:#172033;
}

header{
background:white;
padding:18px 7%;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 15px rgba(0,0,0,.06);
}

.logo{
font-size:25px;
font-weight:bold;
color:#2563eb;
}

nav{
display:flex;
gap:25px;
}

nav a{
text-decoration:none;
color:#374151;
font-weight:bold;
}

main{
max-width:700px;
margin:60px auto;
padding:20px;
}

.card{
background:white;
padding:40px;
border-radius:22px;
box-shadow:0 10px 35px rgba(15,23,42,.08);
}

.icon{
width:75px;
height:75px;
margin:auto auto 20px;
background:#eff5ff;
border-radius:18px;
display:flex;
align-items:center;
justify-content:center;
font-size:38px;
}

h1{
text-align:center;
}

.subtitle{
text-align:center;
color:#64748b;
margin-bottom:30px;
}

.password{
display:flex;
gap:10px;
}

.password input{
flex:1;
padding:14px;
border:1px solid #dbe3ef;
border-radius:10px;
font-size:16px;
}

.copy{
padding:0 18px;
border:0;
border-radius:10px;
background:#111827;
color:white;
cursor:pointer;
}

.options{
margin-top:25px;
}

.options label{
display:block;
margin:12px 0;
}

input[type="range"]{
width:100%;
}

.generate{
width:100%;
padding:14px;
margin-top:20px;
border:0;
border-radius:10px;
background:#2563eb;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.back{
display:block;
text-align:center;
margin-top:25px;
color:#2563eb;
text-decoration:none;
font-weight:bold;
}

@media(max-width:600px){

header{
flex-direction:column;
gap:15px;
}

.card{
padding:25px 20px;
}

}

</style>

</head>

<body>

<header>

<div class="logo">SmartToolsHub</div>

<nav>
<a href="index.html">Home</a>
<a href="index.html#tools">Tools</a>
<a href="index.html#about">About</a>
</nav>

</header>

<main>

<div class="card">

<div class="icon">🔐</div>

<h1>Password Generator</h1>

<p class="subtitle">
Generate strong random passwords.
</p>

<div class="password">

<input type="text" id="password" readonly>

<button class="copy" onclick="copyPassword()">
Copy
</button>

</div>

<div class="options">

<label>
Length: <span id="lengthValue">16</span>
</label>

<input
type="range"
id="length"
min="6"
max="50"
value="16"
oninput="updateLength()">

<label>
<input type="checkbox" id="uppercase" checked>
Uppercase
</label>

<label>
<input type="checkbox" id="lowercase" checked>
Lowercase
</label>

<label>
<input type="checkbox" id="numbers" checked>
Numbers
</label>

<label>
<input type="checkbox" id="symbols" checked>
Symbols
</label>

</div>

<button class="generate" onclick="generatePassword()">
Generate Password
</button>

<a class="back" href="index.html">
← Back to SmartToolsHub
</a>

</div>

</main>

<script>

function updateLength(){

document.getElementById("lengthValue").innerText=
document.getElementById("length").value;

}

function generatePassword(){

let length=parseInt(
document.getElementById("length").value
);

let chars="";

if(document.getElementById("uppercase").checked)
chars+="ABCDEFGHIJKLMNOPQRSTUVWXYZ";

if(document.getElementById("lowercase").checked)
chars+="abcdefghijklmnopqrstuvwxyz";

if(document.getElementById("numbers").checked)
chars+="0123456789";

if(document.getElementById("symbols").checked)
chars+="!@#$%^&*()_+-=[]{}|;:,.<>?";

if(!chars){

alert("Select at least one option.");
return;

}

let password="";

let array=new Uint32Array(length);

crypto.getRandomValues(array);

for(let i=0;i<length;i++){

password+=chars[array[i]%chars.length];

}

document.getElementById("password").value=password;

}

function copyPassword(){

let password=document.getElementById("password");

if(!password.value){

generatePassword();

}

navigator.clipboard.writeText(
document.getElementById("password").value
);

alert("Password copied!");

}

generatePassword();

</script>

</body>
</html>
